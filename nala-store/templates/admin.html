<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | متجر نالا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- 🏆 هيدر لوحة التحكم -->
  <div class="admin-header" style="margin-top: 30px;">
    <div class="admin-logo">لوحة الإدارة ✦</div>
    <div class="brand-tagline">إضافة وإدارة منتجات متجر نالا</div>
    <a href="/" class="btn-view-store">← استعراض المتجر الرئيسي</a>
  </div>

  <div class="admin-container">

    <!-- نموذج إضافة منتج -->
    <div class="product-card" style="margin-bottom: 40px;">
      <h3 class="product-title" style="margin-bottom: 20px;">➕ إضافة منتج جديد</h3>

      <form id="addProductForm" onsubmit="addProduct(event)">

        <div class="form-group">
          <label class="form-label">اسم المنتج:</label>
          <input type="text" id="title" class="form-input" placeholder="مثال: مبخرة اسم بالليزر أنيقة" required>
        </div>

        <!-- 🎛️ الكومبو بوكس لاختيار القسم وتصنيفه تلقائياً -->
        <div class="form-group">
          <label class="form-label">قسم المنتج (التصنيف):</label>
          <select id="category" class="form-input" required>
            <option value="مبخرة">🪵 مباخر مخصصة</option>
            <option value="تيشرت">👕 تيشرتات مطبوعة</option>
            <option value="أكواب">☕ أكواب مخصصة</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">السعر (د.ل):</label>
          <input type="number" step="0.5" id="price" class="form-input" placeholder="مثال: 45" required>
        </div>

        <div class="form-group">
          <label class="form-label">الوصف التفصيلي:</label>
          <textarea id="description" class="form-textarea" placeholder="اكتب تفاصيل خامة المنتج والتوصيل..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">صورة المنتج:</label>
          <input type="file" id="image" class="form-input" accept="image/*" required>
        </div>

        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px;">حفظ وإضافة المنتج 🚀</button>
      </form>
    </div>

    <!-- قائمة المنتجات الحالية -->
    <h3 class="product-title" style="margin-bottom: 20px; font-size: 1.4rem;">📦 المنتجات الحالية في النظام</h3>
    <div class="products-grid" id="adminProductsContainer" style="padding: 0; max-width: 100%; margin-bottom: 60px;">
      <!-- يتم تحميل المنتجات برمجياً هنا -->
    </div>

  </div>

  <script>
    async function fetchAdminProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const container = document.getElementById('adminProductsContainer');

        if (products.length === 0) {
          container.innerHTML = '<div class="empty-msg">لا توجد منتجات مضافة حالياً.</div>';
          return;
        }

        container.innerHTML = products.map(item => `
          <div class="product-card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <div class="image-wrapper" style="height: 180px;">
                <span class="badge">${item.category === 'مبخرة' ? '🪵 مبخرة' : item.category === 'تيشرت' ? '👕 تيشرت' : '☕ كوب'}</span>
                <img src="${item.image}" alt="${item.title}" class="product-image" style="width:100%; height:100%; object-fit:cover;">
              </div>
              <div class="product-info">
                <div class="category">القسم: ${item.category}</div>
                <h3 class="product-title">${item.title}</h3>
                <p class="product-description">${item.description || ''}</p>
              </div>
            </div>
            <div class="card-footer" style="margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 15px;">
              <div class="price">${item.price} <span class="currency">د.ل</span></div>
              <button class="btn-delete" onclick="deleteProduct(${item.id})">حذف 🗑️</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("خطأ في جلب المنتجات", err);
      }
    }

    async function addProduct(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('category', document.getElementById('category').value); // إرسال القسم المختار من الكومبو بوكس
      formData.append('price', document.getElementById('price').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('image', document.getElementById('image').files[0]);

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerText = "جاري الرفع والحفظ... ⏳";
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          alert(data.message);
          document.getElementById('addProductForm').reset();
          fetchAdminProducts();
        } else {
          alert("خطأ: " + data.message);
        }
      } catch (err) {
        alert("حدث خطأ أثناء الاتصال بالسيرفر!");
      } finally {
        submitBtn.innerText = "حفظ وإضافة المنتج 🚀";
        submitBtn.disabled = false;
      }
    }

    async function deleteProduct(id) {
      if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
      try {
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          fetchAdminProducts();
        } else {
          alert("فشل الحذف");
        }
      } catch (err) {
        alert("خطأ في الاتصال");
      }
    }

    window.onload = fetchAdminProducts;
  </script>
</body>
</html>
